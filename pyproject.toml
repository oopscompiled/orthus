[project]
name = "orthus"
version = "0.1.0"
description = "AI Action Firewall for tool-using agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "oopscompiled"}
]
keywords = ["ai-security", "agent-security", "mcp", "prompt-injection", "tool-calling", "firewall"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.47.0",
]

[project.urls]
Homepage = "https://orthus.dev"
Repository = "https://github.com/oopscompiled/orthus"