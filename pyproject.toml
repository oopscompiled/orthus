[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orthus"
version = "0.1.0"
description = "AI Action Firewall for tool-using agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.47.0",
]

[tool.setuptools.packages.find]
include = ["api*"]

[tool.setuptools.package-data]
"api.engine.rules" = ["packs/**/*.yaml"]
"api.engine.policy" = ["default.yaml"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-benchmark>=5.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "benchmark: performance-oriented benchmark tests",
]
