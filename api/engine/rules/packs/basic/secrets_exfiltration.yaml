version: 1
pack: secrets_exfiltration
rules:
  - id: secrets.exfiltrate_token
    description: Secret exfiltration intent
    severity: high
    risk: 0.9
    decision_hint: block
    reason_codes: [secret_exfiltration_intent]
    tags: [secrets, exfiltration]
    match:
      any:
        - field: normalized
          regex: "\\b(exfiltrate|leak|dump|print|reveal|send)\\b.{0,80}\\b(token|api key|apikey|secret|password|credential|private key)\\b"

  - id: secrets.external_destination
    description: Sending sensitive data to external destination
    severity: high
    risk: 0.85
    decision_hint: block
    reason_codes: [external_destination]
    tags: [secrets, exfiltration]
    match:
      any:
        - field: normalized
          regex: "\\b(send|post|upload|exfiltrate)\\b.{0,80}\\b(webhook|pastebin|discord|telegram|external url|http://|https://)\\b"

  - id: secrets.service_account_credentials
    description: Access request for service account credentials/keys/tokens
    severity: high
    risk: 0.78
    decision_hint: require_approval
    reason_codes: [service_account_credentials_access]
    tags: [secrets, credentials]
    match:
      any:
        - field: normalized
          regex: "\\b(service\\s+account|sa)\\b.{0,80}\\b(credentials?|keys?|tokens?)\\b"
        - field: normalized
          regex: "\\b(credentials?|tokens?|keys?)\\b.{0,80}\\b(service\\s+account|aws|gcp|azure)\\b"

  - id: secrets.cloud_credentials
    description: Access request for cloud credentials
    severity: high
    risk: 0.78
    decision_hint: require_approval
    reason_codes: [cloud_credentials_access]
    tags: [secrets, cloud]
    match:
      any:
        - field: normalized
          regex: "\\b(AWS|GCP|Azure)\\b.{0,80}\\b(credentials?|access\\s+key|secret\\s+key|token)\\b"
        - field: normalized
          regex: "\\b(credentials?|access\\s+key|secret\\s+key|token)\\b.{0,80}\\b(AWS|GCP|Azure)\\b"

  - id: secrets.connection_strings
    description: Connection string and DB URL access marker
    severity: medium
    risk: 0.65
    decision_hint: log_only
    reason_codes: [connection_string_access]
    tags: [secrets, database]
    match:
      any:
        - field: normalized
          regex: "\\b(connection\\s+strings?)\\b"
        - field: normalized
          regex: "\\b(database\\s+url|db_url|postgres://|mysql://|mongodb\\+srv://)\\b"
